apiVersion: apps/v1
kind: Deployment
metadata:
  name: turn-server
  namespace: bro-media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: turn-server
  template:
    metadata:
      labels:
        app: turn-server
    spec:
      containers:
        - name: turn-server
          image: your-registry/turn-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TURN_USER
              valueFrom:
                secretKeyRef:
                  name: turn-server-secret
                  key: TURN_USER
            - name: TURN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: turn-server-secret
                  key: TURN_PASSWORD
            - name: TURN_REALM
              valueFrom:
                configMapKeyRef:
                  name: turn-server-config
                  key: TURN_REALM
          ports:
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
            - name: turns-tcp
              containerPort: 5349
              protocol: TCP
            - name: relay-49160
              containerPort: 49160
              protocol: UDP
            - name: relay-49161
              containerPort: 49161
              protocol: UDP
            - name: relay-49162
              containerPort: 49162
              protocol: UDP
            - name: relay-49163
              containerPort: 49163
              protocol: UDP
            - name: relay-49164
              containerPort: 49164
              protocol: UDP
            - name: relay-49165
              containerPort: 49165
              protocol: UDP
            - name: relay-49166
              containerPort: 49166
              protocol: UDP
            - name: relay-49167
              containerPort: 49167
              protocol: UDP
            - name: relay-49168
              containerPort: 49168
              protocol: UDP
            - name: relay-49169
              containerPort: 49169
              protocol: UDP
          volumeMounts:
            - name: turn-config
              mountPath: /etc/coturn/turnserver.conf
              subPath: turnserver.conf
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: turn-config
          configMap:
            name: turn-server-config
            items:
              - key: turnserver.conf
                path: turnserver.conf
