apiVersion: v1
kind: ConfigMap
metadata:
  name: turn-server-config
  namespace: bro-media
data:
  TURN_REALM: bromedia.local
  turnserver.conf: |
    listening-port=3478
    tls-listening-port=5349

    # Keep relay range small for Kubernetes Service exposure.
    min-port=49160
    max-port=49169

    fingerprint
    lt-cred-mech

    # Runtime values replaced by entrypoint using env vars.
    user=bromedia:bromedia-secret
    realm=bromedia.local

    log-file=stdout
    verbose
    no-cli
    no-multicast-peers
