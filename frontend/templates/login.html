<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bro Media – Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>🎥 Bro Media</h1>
        <p class="subtitle">Video calls, chat &amp; screen sharing</p>

        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Login</button>
            <button class="auth-tab" data-tab="signup">Sign Up</button>
        </div>

        <form id="login-form" class="auth-form active">
            <div class="form-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" placeholder="Your username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Your password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <form id="signup-form" class="auth-form">
            <div class="form-group">
                <label for="signup-username">Username</label>
                <input type="text" id="signup-username" placeholder="Choose a username (min 3 chars)" autocomplete="username" required minlength="3">
            </div>
            <div class="form-group">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" placeholder="your@email.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="Min 6 characters" autocomplete="new-password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>

        <p id="auth-error" class="error hidden"></p>
    </div>

    <!-- Config injected from Go template -->
    <script>
        window.BRO_CONFIG = {
            backendURL: "{{.BackendURL}}",
            wsURL: "{{.WsURL}}"
        };
    </script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
