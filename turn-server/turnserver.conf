# TURN server listening port
listening-port=3478
tls-listening-port=5349

# Relay port range
min-port=49152
max-port=65535

# Use fingerprint in TURN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Default user (overridden by entrypoint script at runtime)
user=bromedia:bromedia-secret

# Realm
realm=bromedia.local

# Logging
log-file=stdout
verbose

# Disable CLI
no-cli

# Disable multicast peers (security)
no-multicast-peers
