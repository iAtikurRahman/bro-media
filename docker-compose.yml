services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      BACKEND_URL: "http://localhost:8080"
      WS_URL: "ws://localhost:8080"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      TURN_HOST: "turn-server"
      TURN_PORT: "3478"
      TURN_USER: "${TURN_USER:-bromedia}"
      TURN_PASSWORD: "${TURN_PASSWORD:-bromedia-secret}"
      STUN_HOST: "stun:stun.l.google.com:19302"
      ALLOWED_ORIGIN: "*"
      JWT_SECRET: "${JWT_SECRET:-bro-media-jwt-secret-change-me}"
      DATA_DIR: "/data"
    volumes:
      - backend-data:/data
    depends_on:
      - turn-server
    restart: unless-stopped

  turn-server:
    build:
      context: ./turn-server
      dockerfile: Dockerfile
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49152-49252:49152-49252/udp"
    environment:
      TURN_USER: "${TURN_USER:-bromedia}"
      TURN_PASSWORD: "${TURN_PASSWORD:-bromedia-secret}"
      TURN_REALM: "${TURN_REALM:-bromedia.local}"
    restart: unless-stopped

volumes:
  backend-data:
